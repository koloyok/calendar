name: Update Calendar from Google Drive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file from Google Drive
        run: |
          FILE_ID="1FL77VAjZY3wPrOL2a9NnNG7zAAUZ1HFd"
          curl -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o index.html

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/koloyok/my-calendar.git
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update calendar"
          git push
