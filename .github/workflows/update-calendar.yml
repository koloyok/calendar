name: Update Calendar from Google Drive

on:
  schedule:
    - cron: '0 * * * *'  # checks every hour
  workflow_dispatch:       # lets you trigger it manually too

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download file from Google Drive
        run: |
          FILE_ID="1FL77VAjZY3wPrOL2a9NnNG7zAAUZ1HFd"
          curl -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update calendar"
          git push
