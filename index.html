<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendar</title>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Calendar"/>
<meta name="theme-color" content="#378ADD"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1rem}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.leg{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mc{background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.mc:hover{border-color:#aaa}
.mh{font-size:13px;font-weight:500;padding:8px 12px;background:#f9f9f7;display:flex;justify-content:space-between;align-items:center}
.zh{font-size:10px;color:#aaa;font-weight:400}
.cg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:6px 8px 8px}
.dl{font-size:10px;color:#aaa;text-align:center;padding:2px 0 4px}
.wl{font-size:9px;color:#aaa;text-align:center;padding:2px 0 4px}
.dc{font-size:11px;text-align:center;padding:2px 1px;cursor:pointer;border-radius:4px;line-height:1.5;color:#1a1a1a;transition:background .1s;min-height:22px}
.dc:hover{background:#f0f0ee}
.dc.today{font-weight:500;background:#E6F1FB;color:#0C447C}
.dc.sun{color:#E24B4A}
.dc.hol{color:#E24B4A;font-weight:500}
.wn{font-size:9px;color:#aaa;text-align:center;padding:2px 0;line-height:1.5}
.hb{font-size:9px;padding:1px 4px;border-radius:3px;background:#FCEBEB;color:#A32D2D;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4}
.eb{font-size:8px;padding:1px 4px;border-radius:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px}
.zbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.zbg.open{display:flex}
.zp{background:#fff;border:0.5px solid #ccc;border-radius:12px;width:100%;max-width:600px;margin:auto}
.zhd{padding:14px 18px;background:#f9f9f7;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0}
.zhd h3{font-size:17px;font-weight:500}
.znav{display:flex;align-items:center;gap:8px}
.znav button{background:none;border:0.5px solid #ccc;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.znav button:hover{background:#f0f0ee}
.zx{background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;padding:0 0 0 8px}
.zx:hover{color:#333}
.zg{display:grid;grid-template-columns:repeat(8,1fr);padding:14px 16px 18px;gap:3px}
.zdl{font-size:11px;color:#aaa;text-align:center;padding:4px 0 10px;font-weight:500}
.zwl{font-size:10px;color:#aaa;text-align:center;padding:4px 0 10px;font-weight:500}
.zwn{font-size:10px;color:#aaa;text-align:center;padding:8px 2px 4px}
.zc{border-radius:6px;padding:6px 4px 7px;cursor:pointer;text-align:center;transition:background .1s;border:0.5px solid transparent}
.zc:hover{background:#f0f0ee;border-color:#ddd}
.zc.today{background:#E6F1FB;border-color:#185FA5}
.zc.sun{color:#E24B4A}
.zc.hol{color:#E24B4A}
.zn{font-size:14px;font-weight:500;color:inherit;line-height:1.4}
.zc.today .zn{color:#0C447C}
.zhb{font-size:8px;padding:1px 4px;border-radius:3px;background:#FCEBEB;color:#A32D2D;margin-top:3px;line-height:1.4;white-space:normal;word-break:break-word}
.zeb{font-size:8px;padding:1px 4px;border-radius:3px;margin-top:2px;line-height:1.4;white-space:normal;word-break:break-word}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.mbg.open{display:flex}
.modal{background:#fff;border:0.5px solid #ccc;border-radius:12px;padding:1.25rem;width:320px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:4px}
.mhol{font-size:12px;color:#A32D2D;margin-bottom:8px}
.mfe{margin-bottom:10px}
.cat-lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 3px}
.fc{border-radius:8px;border:0.5px solid #ddd;padding:8px 10px;margin-bottom:5px}
.fc .ft{font-size:13px;font-weight:500;margin-bottom:3px}
.fc .fr{font-size:11px;color:#555;line-height:1.7}
.fc .fl{color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.mbtns button{padding:6px 14px;border-radius:8px;border:0.5px solid #ccc;font-size:13px;cursor:pointer;background:#fff}
.srch-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:#fff;color:#378ADD;border:0.5px solid #ddd;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:400;display:flex;align-items:center;justify-content:center;transition:all .2s}
.srch-btn:hover{background:#f5f5f3}
.top-btn{position:fixed;bottom:90px;right:24px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);color:#555;border:0.5px solid rgba(0,0,0,.1);font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:400;display:none;align-items:center;justify-content:center;transition:all .2s}
.top-btn:hover{background:rgba(255,255,255,0.95)}
.top-btn.show{display:flex}
.srch-bar{display:none;position:fixed;bottom:24px;right:24px;z-index:400;background:#fff;border:0.5px solid #ddd;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:8px 14px;align-items:center;gap:8px;width:280px}
.srch-bar.open{display:flex}
.srch-bar input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:transparent;color:#1a1a1a}
.srch-bar button{background:none;border:none;cursor:pointer;font-size:16px;color:#aaa;padding:0}
.srch-bar button:hover{color:#333}
.srch-count{font-size:11px;color:#aaa;white-space:nowrap}
.dc.srch-match{background:#DBEAFE!important;color:#1e40af!important;font-weight:600;border-radius:4px}
.zc.srch-match{background:#DBEAFE!important;border-color:#378ADD!important}
.zc.srch-match .zn{color:#1e40af!important}
.mc.srch-match{box-shadow:0 0 0 2.5px #378ADD,0 0 10px rgba(55,138,221,.3)!important;border-color:#378ADD!important}
.agenda-btn{background:none;border:0.5px solid #ccc;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:#555;transition:all .2s}
.agenda-btn:hover{background:#f0f0ee}
.agenda-btn.active{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.agenda{display:none;max-width:700px;margin:0 auto}
.agenda.open{display:block}
.ag-month{margin-bottom:24px}
.ag-month-hd{font-size:13px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;padding:4px 0 8px;border-bottom:0.5px solid #eee;margin-bottom:8px}
.ag-item{display:flex;gap:12px;padding:8px 0;border-bottom:0.5px solid #f0f0ee;align-items:flex-start}
.ag-date{min-width:48px;text-align:center}
.ag-day{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.2}
.ag-dow{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.04em}
.ag-date.today-date .ag-day{color:#0C447C}
.ag-date.today-date .ag-dow{color:#378ADD}
.ag-events{flex:1;display:flex;flex-direction:column;gap:4px}
.ag-ev{border-radius:8px;padding:6px 10px}
.ag-ev .ag-et{font-size:13px;font-weight:500}
.ag-ev .ag-ed{font-size:11px;color:#666;margin-top:2px;line-height:1.6}
.ag-hol{font-size:11px;color:#A32D2D;background:#FCEBEB;border-radius:6px;padding:3px 8px;display:inline-block;margin-bottom:2px}
.ag-empty{text-align:center;color:#aaa;font-size:13px;padding:40px 0}
@media(max-width:600px){
  .zbg{padding:8px 2px}
  .zp{border-radius:8px}
  .zhd{padding:10px 12px}
  .zhd h3{font-size:14px}
  .zg{padding:8px 6px 10px;gap:2px}
  .zc{padding:4px 2px 5px}
  .zn{font-size:12px}
  .zdl,.zwl{font-size:9px;padding:3px 0 6px}
  .zwn{font-size:9px}
  .zeb,.zhb{font-size:7px;padding:1px 3px}
}
.top-left{display:flex;gap:8px;align-items:center}
.yr-sel{font-size:22px;font-weight:700;border:none;background:transparent;color:#1a1a1a;cursor:pointer;outline:none;font-family:inherit;padding:2px 4px;border-radius:8px}
.yr-sel:hover{background:#f0f0ee}
</style>
</head>
<body>
<div class="top">
  <div class="top-left">
    <select id="yearSel" class="yr-sel" onchange="setYear(+this.value)">
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
    <button class="agenda-btn" id="agendaBtn" onclick="toggleAgenda()">☰ Agenda</button>
  </div>
  <div class="leg">
    <div class="li"><div style="width:9px;height:9px;border-radius:50%;background:#E24B4A;flex-shrink:0"></div>Holiday/Sun</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:#EAF3DE;border:0.5px solid #3B6D11;flex-shrink:0"></div>DCTC (AM)</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:#E6F1FB;border:0.5px solid #185FA5;flex-shrink:0"></div>DCTC (PM)</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:#FAEEDA;border:0.5px solid #BA7517;flex-shrink:0"></div>Event</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:#FEFCE8;border:0.5px solid #C9A800;flex-shrink:0"></div>OTG</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:#EEEDFE;border:0.5px solid #7F77DD;flex-shrink:0"></div>Personal</div>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="agenda" id="agenda"></div>

<div class="zbg" id="zbg">
  <div class="zp">
    <div class="zhd">
      <h3 id="zt"></h3>
      <div class="znav">
        <button onclick="sz(-1)">&#8592;</button>
        <button onclick="sz(1)">&#8594;</button>
        <button class="zx" onclick="cz()">&#10005;</button>
      </div>
    </div>
    <div class="zg" id="zg"></div>
  </div>
</div>

<div class="mbg" id="mbg">
  <div class="modal">
    <h3 id="mt"></h3>
    <div class="mhol" id="mh" style="display:none"></div>
    <div class="mfe" id="mfe"></div>
    <div class="mbtns">
      <button onclick="cm()">Close</button>
    </div>
  </div>
</div>

<script>
const H={
  '2026-01-01':"New Year's Day",
  '2026-02-17':'Lunar New Year','2026-02-18':'Lunar New Year',
  '2026-03-21':'Hari Raya Puasa','2026-03-23':'Hari Raya Puasa (obs.)',
  '2026-04-03':'Good Friday',
  '2026-05-01':'Labour Day','2026-05-27':'Hari Raya Haji',
  '2026-05-31':'Vesak Day','2026-06-01':'Vesak Day (obs.)',
  '2026-08-09':'National Day','2026-08-10':'National Day (obs.)',
  '2026-11-08':'Deepavali','2026-11-09':'Deepavali (obs.)',
  '2026-12-25':'Christmas Day',
  '2027-01-01':"New Year's Day",
  '2027-02-06':'Lunar New Year','2027-02-07':'Lunar New Year','2027-02-08':'Lunar New Year (obs.)',
  '2027-03-10':'Hari Raya Puasa*','2027-03-26':'Good Friday',
  '2027-05-01':'Labour Day',
  '2027-05-17':'Hari Raya Haji*',
  '2027-05-20':'Vesak Day*',
  '2027-08-09':'National Day',
  '2027-10-29':'Deepavali*',
  '2027-12-25':'Christmas Day'
};
const FE={
  '2026-04-09':[{t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'}],
  '2026-04-10':[{t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'}],
  '2026-04-14':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-04-15':[{t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}],
  '2026-04-16':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1715'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-04-21':[{t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'}],
  '2026-04-22':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-04-23':[{t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'}],
  '2026-04-24':[{t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'}],
  '2026-05-04':[{t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}],
  '2026-05-08':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-05-14':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'AI x You! Build Night',d:[{l:'Time',v:'1800–2100'},{l:'Venue',v:'The Trampoline by Access Singapore'}],c:'#7C5A00',b:'#FEFCE8',cat:'otg'}
  ],
  '2026-05-20':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1715'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],

  '2026-05-28':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-05-29':[
    {t:'DCTC (AM)',d:[{l:'Time',v:'0830–1200'}],c:'#3B6D11',b:'#EAF3DE',cat:'event'},
    {t:'DCTC (PM)',d:[{l:'Time',v:'1300–1630'}],c:'#0C447C',b:'#E6F1FB',cat:'event'}
  ],
  '2026-04-11':[{t:'Tomb-sweeping',d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal'}],
  '2026-04-12':[{t:'Furniture moving',d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal'}],
  '2026-04-27':[
    {t:'OTG Meeting (AdminLess)',d:[{l:'Time',v:'1600–1700'},{l:'Venue',v:'Online'}],c:'#7C5A00',b:'#FEFCE8',cat:'otg'}
  ],
  '2026-04-28':[
    {t:'TCM',d:[{l:'Time',v:'1345'},{l:'Venue',v:'The TCM Folks'}],c:'#7F77DD',b:'#EEEDFE',cat:'personal'}
  ],
  '2026-04-29':[
    {t:'Physiotherapy',d:[{l:'Time',v:'1400'},{l:'Venue',v:'Pioneer Polyclinic'}],c:'#7F77DD',b:'#EEEDFE',cat:'personal'}
  ],
  '2026-05-07':[
    {t:'TCM',d:[{l:'Time',v:'1400'},{l:'Venue',v:'The TCM Folks'}],c:'#7F77DD',b:'#EEEDFE',cat:'personal'}
  ],
  '2026-05-11':[
    {t:'OTG Team Meeting',d:[{l:'Time',v:'1000–1100'},{l:'Venue',v:'Online'}],c:'#7C5A00',b:'#FEFCE8',cat:'otg'},
    {t:'OTG (SLL HR Portal review meeting)',d:[{l:'Time',v:'1430–1600'},{l:'Venue',v:'Online'}],c:'#7C5A00',b:'#FEFCE8',cat:'otg'}
  ],
  '2026-05-15':[
    {t:'ICT Preparation Seminar',d:[{l:'Time',v:'1300–1700'},{l:'Venue',v:'Changi Naval Base'},{l:'Attire',v:'No.4 Dress with Head Dress'}],c:'#BA7517',b:'#FAEEDA',cat:'event'}
  ],
  '2026-06-01':[{t:'Anniversary',d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}],
  '2026-07-04':[{t:"HY's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}],
  '2026-08-22':[{t:"CS's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}],
  '2026-09-15':[{t:"Fred's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}],
  '2026-09-16':[
    {t:"Rene's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'},
    {t:"Papu's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}
  ],
  '2026-11-29':[{t:"LW's Birthday",d:[],c:'#7F77DD',b:'#EEEDFE',cat:'personal',recur:'yearly'}]
};

// Recurrence engine — build MM-DD lookup for yearly events
const recurByMMDD={};
Object.entries(FE).forEach(([date,evs])=>{
  evs.forEach(ev=>{
    if(ev.recur==='yearly'){
      const mmdd=date.slice(5);
      if(!recurByMMDD[mmdd])recurByMMDD[mmdd]=[];
      recurByMMDD[mmdd].push(ev);
    }
  });
});
// Get all events for a date — direct non-recurring + yearly recurring matches
function getEvs(s){
  const direct=(FE[s]||[]).filter(ev=>!ev.recur);
  const recurring=recurByMMDD[s.slice(5)]||[];
  return[...direct,...recurring];
}
let zi=0;
const td=new Date();
let viewYear=td.getFullYear()<2026?2026:td.getFullYear()>2027?2027:td.getFullYear();

function setYear(y){
  viewYear=y;
  document.getElementById('yearSel').value=y;
  ra();
}
function ra(){
  const g=document.getElementById('grid');g.innerHTML='';
  for(let i=0;i<12;i++){
    const m=i+1;
    const idx=(viewYear-2026)*12+i;
    const card=mm(viewYear,m,idx);
    if(viewYear===td.getFullYear()&&m===td.getMonth()+1)card.id='current-month';
    g.appendChild(card);
  }
  if(window.innerWidth<=600){const cm=document.getElementById('current-month');if(cm)setTimeout(()=>cm.scrollIntoView({behavior:'smooth',block:'start'}),100);}
}
const ts=`${td.getFullYear()}-${p2(td.getMonth()+1)}-${p2(td.getDate())}`;
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

function p2(n){return String(n).padStart(2,'0')}
function ds(y,m,d){return`${y}-${p2(m)}-${p2(d)}`}
function wkn(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-(x.getDay()+6)%7);const w=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w)/86400000-3+(w.getDay()+6)%7)/7);}
function mm(y,m,idx){
  const card=document.createElement('div');card.className='mc';card.onclick=()=>oz(idx);
  const fd=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  const th=document.createElement('div');th.className='mh';
  th.innerHTML=`<span>${MN[m-1]}</span><span style="display:flex;align-items:center;gap:8px"><span class="zh">click to expand</span><span>${y}</span></span>`;
  card.appendChild(th);
  const g=document.createElement('div');g.className='cg';
  ['Wk','Mo','Tu','We','Th','Fr','Sa','Su'].forEach(l=>{const e=document.createElement('div');e.className=l==='Wk'?'wl':'dl';e.textContent=l;g.appendChild(e);});

(function(){
  let tx=0,ty=0,swiping=false;
  const zp=document.querySelector('.zp');

      swiping=true;

    const dx=e.changedTouches[0].clientX-tx;
    const dy=e.changedTouches[0].clientY-ty;

function toggleSearch(){
  const bar=document.getElementById('srchBar');
  const btn=document.getElementById('srchBtn');
  if(bar.classList.contains('open')){closeSearch();}
  else{bar.classList.add('open');btn.style.display='none';setTimeout(()=>document.getElementById('srchInput').focus(),50);}
}
function closeSearch(){
  document.getElementById('srchBar').classList.remove('open');
  document.getElementById('srchBtn').style.display='flex';
  document.getElementById('srchInput').value='';
  document.getElementById('srchCount').textContent='';
  clearSearch();
}
function clearSearch(){
  document.querySelectorAll('.mc.srch-match,.dc.srch-match,.zc.srch-match').forEach(el=>el.classList.remove('srch-match'));
}
function doSearch(q){
  clearSearch();
  if(!q.trim()){document.getElementById('srchCount').textContent='';return;}
  const term=q.toLowerCase().trim();
  let matchCount=0;
  // Find all matching dates
  const matchDates=new Set();
  Object.entries(FE).forEach(([date,evs])=>{
    evs.forEach(ev=>{
      const inTitle=ev.t.toLowerCase().includes(term);
      const inDetails=(ev.d||[]).some(d=>d.l.toLowerCase().includes(term)||d.v.toLowerCase().includes(term));
      if(inTitle||inDetails){
        matchDates.add(date);
        // Also add recurring occurrences in other years
        if(ev.recur==='yearly'){for(let y=2026;y<=2027;y++)matchDates.add(`${y}-${date.slice(5)}`);}
      }
    });
  });
  // Also search holidays
  Object.entries(H).forEach(([date,name])=>{
    if(name.toLowerCase().includes(term))matchDates.add(date);
  });
  // Highlight matching month cards and day cells
  const cards=document.querySelectorAll('.mc');
  matchDates.forEach(date=>{
    document.querySelectorAll('.dc[data-date="'+date+'"], .zc[data-date="'+date+'"]').forEach(el=>el.classList.add('srch-match'));
    const[y,m]=date.split('-').map(Number);
    const idx=(y-2026)*12+(m-1);
    if(cards[idx])cards[idx].classList.add('srch-match');
    matchCount++;
  });
  document.getElementById('srchCount').textContent=matchCount?`${matchCount} match${matchCount>1?'es':''}`:'no matches';
}

let agendaOpen=false;

  agendaOpen=!agendaOpen;

  else{

function buildAgenda(){
  const ag=document.getElementById('agenda');
  ag.innerHTML='';
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // Collect all dates with events
  const allDates=new Set();
  Object.keys(FE).forEach(d=>allDates.add(d));
  Object.keys(H).forEach(d=>allDates.add(d));
  // Add recurring event dates for all years in range
  Object.keys(recurByMMDD).forEach(mmdd=>{
    for(let y=2026;y<=2027;y++){allDates.add(`${y}-${mmdd}`);}
  });
  // Sort dates — only today and future
  const sorted=[...allDates].filter(d=>d>=ts).sort();
  // Group by month
  const byMonth={};
  sorted.forEach(date=>{
    const key=date.slice(0,7);
    if(!byMonth[key])byMonth[key]=[];
    byMonth[key].push(date);
  });
  if(!sorted.length){ag.innerHTML='<div class="ag-empty">No events found.</div>';return;}
  Object.entries(byMonth).forEach(([key,dates])=>{
    const[y,m]=key.split('-').map(Number);
    const sec=document.createElement('div');sec.className='ag-month';
    const hd=document.createElement('div');hd.className='ag-month-hd';
    hd.textContent=`${MN[m-1]} ${y}`;sec.appendChild(hd);
    dates.forEach(date=>{
      const[dy,dm,dd]=date.split('-').map(Number);
      const dateObj=new Date(dy,dm-1,dd);
      const isToday=date===ts;
      const item=document.createElement('div');item.className='ag-item';
      // Date column
      const dc=document.createElement('div');
      dc.className='ag-date'+(isToday?' today-date':'');
      dc.innerHTML=`<div class="ag-day">${dd}</div><div class="ag-dow">${DOW[dateObj.getDay()]}</div>`;
      item.appendChild(dc);
      // Events column
      const ec=document.createElement('div');ec.className='ag-events';
      // Holiday
      if(H[date]){const h=document.createElement('div');h.className='ag-hol';h.textContent='🏖 '+H[date];ec.appendChild(h);}
      // FE events
      getEvs(date).forEach(ev=>{
        const e=document.createElement('div');e.className='ag-ev';
        e.style.background=ev.b;
        let details='';
        (ev.d||[]).forEach(d=>{details+=`${d.l}: ${d.v}<br>`;});
        e.innerHTML=`<div class="ag-et" style="color:${ev.c}">${ev.t}</div>${details?`<div class="ag-ed">${details}</div>`:''}`;
        ec.appendChild(e);
      });
      item.appendChild(ec);
      item.style.cursor='pointer';
      item.onclick=()=>om(date,dy,dm,dd);
      sec.appendChild(item);
    });
    ag.appendChild(sec);
  });
}
