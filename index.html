<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendar</title>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Calendar"/>
<meta name="theme-color" content="#378ADD"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --crimson-text:#A32D2D;--crimson-bg:#FCEBEB;
  --tangerine-text:#8A4500;--tangerine-bg:#FAEEDA;
  --amber-text:#7C5A00;--amber-bg:#FEFCE8;
  --sand-text:#7A5C2E;--sand-bg:#FAF3E8;
  --emerald-text:#1E5C2E;--emerald-bg:#E3F2E8;
  --lagoon-text:#0A6B7A;--lagoon-bg:#E3F5F7;
  --sky-text:#1A7FBF;--sky-bg:#EAF4FC;
  --cerulean-text:#0C447C;--cerulean-bg:#E6F1FB;
  --violet-text:#5B52C4;--violet-bg:#EEEDFE;
  --plum-text:#6B3680;--plum-bg:#F4EAF9;
  --orchid-text:#9C3B6B;--orchid-bg:#FDEEF6;
  --brand:#378ADD;
  --brand-border:#185FA5;
  --coral:#E24B4A;
  --search-bg:#DBEAFE;
  --search-text:#1E40AF;
}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1rem}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.leg{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mc{background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.cur-month{border-left:3px solid var(--brand)}
.mc:hover{border-color:#aaa}
.mh{font-size:13px;font-weight:500;padding:8px 12px;background:#f9f9f7;display:flex;justify-content:space-between;align-items:center}
.zh{font-size:10px;color:#aaa;font-weight:400}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:6px 8px 8px}
.dl{font-size:10px;color:#aaa;text-align:center;padding:2px 0 4px}
.dc{font-size:11px;text-align:center;padding:2px 1px;cursor:pointer;border-radius:4px;line-height:1.5;color:#1a1a1a;transition:background .1s;min-height:22px}
.dc:hover{background:#f0f0ee}
.dc.today{font-weight:500;background:var(--cerulean-bg);color:var(--cerulean-text)}
.dc.sun{color:var(--coral)}
.dc.hol{color:var(--coral);font-weight:500}
.hb{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--crimson-bg);color:var(--crimson-text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4}
.eb{font-size:8px;padding:1px 4px;border-radius:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px}
.zbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.zbg.open{display:flex}
.zp{background:#fff;border:0.5px solid #ccc;border-radius:12px;width:100%;max-width:600px;margin:auto}
.zhd{padding:14px 18px;background:#f9f9f7;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0}
.zhd h3{font-size:17px;font-weight:500}
.znav{display:flex;align-items:center;gap:8px}
.znav button{background:none;border:0.5px solid #ccc;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.znav button:hover{background:#f0f0ee}
.zx{background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;padding:0 0 0 8px}
.zx:hover{color:#333}
.zg{display:grid;grid-template-columns:repeat(7,1fr);padding:14px 16px 18px;gap:3px}
.zdl{font-size:11px;color:#aaa;text-align:center;padding:4px 0 10px;font-weight:500}
.zc{border-radius:6px;padding:6px 4px 7px;cursor:pointer;text-align:center;transition:background .1s;border:0.5px solid transparent}
.zc:hover{background:#f0f0ee;border-color:#ddd}
.zc.today{background:var(--cerulean-bg);border-color:var(--brand-border)}
.zc.sun{color:var(--coral)}
.zc.hol{color:var(--coral)}
.zn{font-size:14px;font-weight:500;color:inherit;line-height:1.4}
.zc.today .zn{color:var(--cerulean-text)}
.zhb{font-size:8px;padding:1px 4px;border-radius:3px;background:var(--crimson-bg);color:var(--crimson-text);margin-top:3px;line-height:1.4;white-space:normal;word-break:break-word}
.zeb{font-size:8px;padding:1px 4px;border-radius:3px;margin-top:2px;line-height:1.4;white-space:normal;word-break:break-word}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.mbg.open{display:flex}
.modal{background:#fff;border:0.5px solid #ccc;border-radius:12px;padding:1.25rem;width:320px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:4px}
.mhol{font-size:12px;color:var(--crimson-text);margin-bottom:8px}
.mfe{margin-bottom:10px}
.cat-lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 3px}
.fc{border-radius:8px;border:0.5px solid #ddd;padding:8px 10px;margin-bottom:5px}
.fc .ft{font-size:13px;font-weight:500;margin-bottom:3px}
.fc .fr{font-size:11px;color:#555;line-height:1.7}
.fc .fl{color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.mbtns button{padding:6px 14px;border-radius:8px;border:0.5px solid #ccc;font-size:13px;cursor:pointer;background:#fff}
.srch-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--brand);border:0.5px solid #ddd;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:400;display:flex;align-items:center;justify-content:center;transition:all .2s}
.srch-btn:hover{background:#f5f5f3}
.top-btn{position:fixed;bottom:90px;right:24px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);color:#555;border:0.5px solid rgba(0,0,0,.1);font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:400;display:none;align-items:center;justify-content:center;transition:all .2s}
.top-btn:hover{background:rgba(255,255,255,0.95)}
.top-btn.show{display:flex}
.srch-bar{display:none;position:fixed;bottom:24px;right:24px;z-index:400;background:#fff;border:0.5px solid #ddd;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:8px 14px;align-items:center;gap:8px;width:280px}
.srch-bar.open{display:flex}
.srch-bar input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:transparent;color:#1a1a1a}
.srch-bar button{background:none;border:none;cursor:pointer;font-size:16px;color:#aaa;padding:0}
.srch-bar button:hover{color:#333}
.srch-count{font-size:11px;color:#aaa;white-space:nowrap}
.dc.srch-match{background:var(--search-bg)!important;color:var(--search-text)!important;font-weight:600;border-radius:4px}
.zc.srch-match{background:var(--search-bg)!important;border-color:var(--brand)!important}
.zc.srch-match .zn{color:var(--search-text)!important}
.mc.srch-match{box-shadow:0 0 0 2.5px var(--brand),0 0 10px rgba(55,138,221,.3)!important;border-color:var(--brand)!important}
.agenda-btn{background:none;border:0.5px solid #ccc;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:#555;transition:all .2s}
.agenda-btn:hover{background:#f0f0ee}
.agenda-btn.active{background:var(--cerulean-bg);border-color:var(--brand-border);color:var(--cerulean-text)}
.agenda{display:none;max-width:700px;margin:0 auto}
.agenda.open{display:block}
.ag-month{margin-bottom:24px}
.ag-month-hd{font-size:13px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;padding:4px 0 8px;border-bottom:0.5px solid #eee;margin-bottom:8px}
.ag-item{display:flex;gap:12px;padding:8px 0;border-bottom:0.5px solid #f0f0ee;align-items:flex-start}
.ag-date{min-width:48px;text-align:center}
.ag-day{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.2}
.ag-dow{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.04em}
.ag-date.today-date .ag-day{color:var(--cerulean-text)}
.ag-date.today-date .ag-dow{color:var(--brand)}
.ag-events{flex:1;display:flex;flex-direction:column;gap:4px}
.ag-ev{border-radius:8px;padding:6px 10px}
.ag-ev .ag-et{font-size:13px;font-weight:500}
.ag-ev .ag-ed{font-size:11px;color:#666;margin-top:2px;line-height:1.6}
.ag-hol{font-size:11px;color:var(--crimson-text);background:var(--crimson-bg);border-radius:6px;padding:3px 8px;display:inline-block;margin-bottom:2px}
.ag-empty{text-align:center;color:#aaa;font-size:13px;padding:40px 0}
@media(max-width:600px){
  .zbg{padding:8px 2px}
  .zp{border-radius:8px}
  .zhd{padding:10px 12px}
  .zhd h3{font-size:14px}
  .zg{padding:8px 6px 10px;gap:2px}
  .zc{padding:4px 2px 5px}
  .zn{font-size:12px}
  .zdl{font-size:9px;padding:3px 0 6px}
  .zeb,.zhb{font-size:7px;padding:1px 3px}
}
.top-left{display:flex;gap:8px;align-items:center}
.yr-sel{font-size:22px;font-weight:700;border:none;background:transparent;color:#1a1a1a;cursor:pointer;outline:none;font-family:inherit;padding:2px 4px;border-radius:8px}
.yr-sel:hover{background:#f0f0ee}
</style>
</head>

<div class="top">
  <div class="top-left">
    <select id="yearSel" class="yr-sel" onchange="setYear(+this.value)">
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
    <button class="agenda-btn" id="agendaBtn" onclick="toggleAgenda()">☰ Agenda</button>
  </div>
  <div class="leg">
    <div class="li"><div style="width:9px;height:9px;border-radius:50%;background:var(--coral);flex-shrink:0"></div>Holiday/Sun</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--violet-bg);border:0.5px solid var(--violet-text);flex-shrink:0"></div>Personal</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--tangerine-bg);border:0.5px solid var(--tangerine-text);flex-shrink:0"></div>Event</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--emerald-bg);border:0.5px solid var(--emerald-text);flex-shrink:0"></div>DCTC (AM)</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--cerulean-bg);border:0.5px solid var(--cerulean-text);flex-shrink:0"></div>DCTC (PM)</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--amber-bg);border:0.5px solid var(--amber-text);flex-shrink:0"></div>OTG</div>
    <div class="li"><div style="width:22px;height:9px;border-radius:2px;background:var(--sand-bg);border:0.5px solid var(--sand-text);flex-shrink:0"></div>Invited</div>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="agenda" id="agenda"></div>

<div class="zbg" id="zbg">
  <div class="zp">
    <div class="zhd">
      <h3 id="zt"></h3>
      <div class="znav">
        <button onclick="sz(-1)">&#8592;</button>
        <button onclick="sz(1)">&#8594;</button>
        <button class="zx" onclick="cz()">&#10005;</button>
      </div>
    </div>
    <div class="zg" id="zg"></div>
  </div>
</div>

<div class="mbg" id="mbg" tabindex="-1">
  <div class="modal">
    <h3 id="mt"></h3>
    <div class="mhol" id="mh" style="display:none"></div>
    <div class="mfe" id="mfe"></div>
    <div class="mbtns">
      <button onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

// Recurrence engine — build MM-DD lookup for yearly events
const recurByMMDD={};
Object.entries(FE).forEach(([date,evs])=>{
  evs.forEach(ev=>{
    if(ev.recur==='yearly'){
      const mmdd=date.slice(5);
      if(!recurByMMDD[mmdd])recurByMMDD[mmdd]=[];
      recurByMMDD[mmdd].push(ev);
    }
  });
});
// Get all events for a date — direct non-recurring + yearly recurring matches
function getEvs(s){
  const direct=(FE[s]||[]).filter(ev=>!ev.recur);
  const recurring=recurByMMDD[s.slice(5)]||[];
  return[...direct,...recurring];
}

// Swipe gesture helper
function makeSwipe(el,cb){
  let tx=0,ty=0,swiping=false;
  el.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;swiping=false;},{passive:true});
  el.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){swiping=true;e.preventDefault();}
  },{passive:false});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    if(swiping&&Math.abs(dx)>50)cb(dx<0?1:-1);
    swiping=false;
  },{passive:true});
}

function clearSearch(){
  document.querySelectorAll('.mc.srch-match,.dc.srch-match,.zc.srch-match').forEach(el=>el.classList.remove('srch-match'));
}
function doSearch(q){
  clearSearch();
  if(!q.trim()){document.getElementById('srchCount').textContent='';return;}
  const term=q.toLowerCase().trim();
  // Find all matching dates
  const matchDates=new Set();
  Object.entries(FE).forEach(([date,evs])=>{
    evs.forEach(ev=>{
      const inTitle=ev.t.toLowerCase().includes(term);
      const inDetails=(ev.d||[]).some(d=>d.l.toLowerCase().includes(term)||d.v.toLowerCase().includes(term));
      if(inTitle||inDetails){
        if(ev.recur==='yearly'){for(let y=2026;y<=2027;y++)matchDates.add(`${y}-${date.slice(5)}`);}
        else matchDates.add(date);
      }
    });
  });
  // Also search holidays
  Object.entries(H).forEach(([date,name])=>{
    if(name.toLowerCase().includes(term))matchDates.add(date);
  });
  // Highlight matching month cards and day cells
  const cards=document.querySelectorAll('.mc');
  matchDates.forEach(date=>{
    document.querySelectorAll('.dc[data-date="'+date+'"], .zc[data-date="'+date+'"]').forEach(el=>el.classList.add('srch-match'));
    const[y,m]=date.split('-').map(Number);
    const idx=(y-2026)*12+(m-1);
    if(cards[idx])cards[idx].classList.add('srch-match');
  });
  const matchCount=matchDates.size;
  document.getElementById('srchCount').textContent=matchCount?`${matchCount} match${matchCount>1?'es':''}`:'no matches';
}

function buildAgenda(){
  const ag=document.getElementById('agenda');
  ag.innerHTML='';
  // Collect all dates with events
  const allDates=new Set();
  Object.keys(FE).forEach(d=>allDates.add(d));
  Object.keys(H).forEach(d=>allDates.add(d));
  // Add recurring event dates for all years in range
  Object.keys(recurByMMDD).forEach(mmdd=>{
    for(let y=2026;y<=2027;y++){allDates.add(`${y}-${mmdd}`);}
  });
  // Sort dates — only today and future
  const sorted=[...allDates].filter(d=>d>=ts).sort();
  // Group by month
  const byMonth={};
  sorted.forEach(date=>{
    const key=date.slice(0,7);
    if(!byMonth[key])byMonth[key]=[];
    byMonth[key].push(date);
  });
  if(!sorted.length){ag.innerHTML='<div class="ag-empty">No events found.</div>';return;}
  Object.entries(byMonth).forEach(([key,dates])=>{
    const[y,m]=key.split('-').map(Number);
    const sec=document.createElement('div');sec.className='ag-month';
    const hd=document.createElement('div');hd.className='ag-month-hd';
    hd.textContent=`${MN[m-1]} ${y}`;sec.appendChild(hd);
    dates.forEach(date=>{
      const[dy,dm,dd]=date.split('-').map(Number);
      const dateObj=new Date(dy,dm-1,dd);
      const isToday=date===ts;
      const item=document.createElement('div');item.className='ag-item';
      // Date column
      const dc=document.createElement('div');
      dc.className='ag-date'+(isToday?' today-date':'');
      dc.innerHTML=`<div class="ag-day">${dd}</div><div class="ag-dow">${DOW[dateObj.getDay()]}</div>`;
      item.appendChild(dc);
      // Events column
      const ec=document.createElement('div');ec.className='ag-events';
      // Holiday
      if(H[date]){const h=document.createElement('div');h.className='ag-hol';h.textContent='🏖 '+H[date];ec.appendChild(h);}
      // FE events
      getEvs(date).forEach(ev=>{
        const e=document.createElement('div');e.className='ag-ev';
        e.style.background=ev.b;
        let details='';
        (ev.d||[]).forEach(d=>{details+=`${d.l}: ${d.v}<br>`;});
        e.innerHTML=`<div class="ag-et" style="color:${ev.c}">${ev.t}</div>${details?`<div class="ag-ed">${details}</div>`:''}`;
        ec.appendChild(e);
      });
      item.appendChild(ec);
      item.style.cursor='pointer';
      item.onclick=()=>om(date,dy,dm,dd);
      sec.appendChild(item);
    });
    ag.appendChild(sec);
  });
}

// Service Worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.log('SW registered'))
      .catch(err=>console.error('SW error:',err));
  });
}
